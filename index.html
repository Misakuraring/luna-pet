<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="format-detection" content="telephone=no" />
    <title>Luna · 手机桌宠</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luna" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- 顶部：时间 / 日期 / 电量 -->
      <header class="clock" id="clock-panel">
        <div class="clock__time-row">
          <span class="clock__time" id="clock-time">--:--</span>
          <span class="clock__seconds" id="clock-seconds">--</span>
        </div>

        <div class="clock__meta">
          <p class="clock__date" id="clock-date">正在读取时间…</p>
          <p class="clock__battery" id="clock-battery" hidden><span class="clock__battery-icon" id="clock-battery-icon" aria-hidden="true">🔋</span><span class="clock__battery-text" id="clock-battery-text">--%</span></p>
        </div>
      </header>

      <!-- 中部：宠物舞台（立绘与气泡由 js/pet.js 注入 / 控制） -->
      <main class="stage" id="pet-stage" data-state="IDLE">
        <div
          class="bubble"
          id="luna-bubble"
          role="status"
          aria-live="polite"
          aria-hidden="true"
        >
          <p class="bubble__text" id="luna-bubble-text"></p>
        </div>

        <div
          class="pet"
          id="luna-pet"
          data-mood="IDLE"
          role="img"
          aria-label="Luna，星光紫蓝渐变猫娘，轻点可互动"
        >
          <!-- <img class="pet__img"> 由 js/pet.js 按当前造型注入 -->
        </div>
      </main>

      <!-- 底部：操作栏（横屏摆件模式下自动隐藏） -->
      <footer class="action-bar" id="action-bar">
        <button class="btn" type="button" id="btn-feed">投喂</button>
        <button class="btn" type="button" id="btn-pat">摸头</button>
        <button class="btn" type="button" id="btn-sleep">休息</button>
        <button class="btn" type="button" id="btn-theme">切换主题</button>
      </footer>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
